[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-terminal-sdk"
version = "0.1.0"
description = "Governed terminal: every command is classified, gated by who typed it, run inside a job object, its output scrubbed, and a hash-only transcript kept on a custody chain."
requires-python = ">=3.10"
dependencies = ["vega-custody-sdk", "vega-governance-jacket-sdk"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
